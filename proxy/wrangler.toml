# 英検3級 パスポート：AI 中継（Cloudflare Worker）の設定
# 公開：  npx wrangler deploy
# キー登録：npx wrangler secret put MODELLIX_API_KEY
name = "eiken3-ai"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
# 受け付けるサイト（公開先と、手元の確認用）
ALLOWED_ORIGINS = "https://sleipnir167.github.io,http://localhost:8766"
# 使ってよいモデル（先頭が既定。安い順におすすめ）
ALLOWED_MODELS = "deepseek/deepseek-v4-flash"
# 1回の出力トークンの上限（英作文の添削でも 1,500 前後で足りる）
MAX_TOKENS = "1800"

# IP ごとに 1 分あたり 12 回まで（使いすぎ・悪用の防止）
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "3001"

  [ratelimits.simple]
  limit = 12
  period = 60
